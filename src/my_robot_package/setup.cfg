[develop]
script_dir=$base/lib/my_robot_package
[install]
install_scripts=$base/lib/my_robot_package

[flake8]
# Long ROS parameter descriptions and assistant prompts are clearer intact.
extend-ignore=E501

[pydocstyle]
# ROS callbacks and hardware helpers are intentionally named rather than
# carrying repetitive one-line docstrings; validate the docstrings that exist.
ignore=D100,D101,D102,D103,D104,D107,D203,D212

[tool:pytest]
# Do not mistake the installed OAK-D diagnostic executable for a unit test.
python_files=test_*.py
