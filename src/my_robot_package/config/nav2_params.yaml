amcl:
  ros__parameters:
    use_sim_time: false
    base_frame_id: "base_footprint"
    global_frame_id: "map"
    odom_frame_id: "odom"
    update_min_d: 0.25 
    update_min_a: 0.5  
    transform_tolerance: 1.5 
    tf_broadcast: true
    alpha1: 0.005
    alpha2: 0.005
    alpha3: 0.1
    alpha4: 0.1
    alpha5: 0.2
    min_particles: 500
    max_particles: 2000
    laser_model_type: "likelihood_field"
    do_beamskip: true
    beam_skip_distance: 0.3
    beam_skip_threshold: 0.3
    beam_skip_error_threshold: 0.9
    z_hit: 0.5
    z_rand: 0.5
    sigma_hit: 0.5
    
map_server:
  ros__parameters:
    use_sim_time: false
    topic_name: "map"
    frame_id: "map"

bt_navigator:
  ros__parameters:
    use_sim_time: false
    global_frame: map
    robot_base_frame: base_footprint
    odom_topic: /odom
    transform_tolerance: 1.5 
    default_server_timeout: 20

controller_server:
  ros__parameters:
    use_sim_time: false
    controller_frequency: 5.0  
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["general_goal_checker"] 
    controller_plugins: ["FollowPath"]
    transform_tolerance: 2.0
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.05
      movement_time_allowance: 30.0
    general_goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.3
      yaw_goal_tolerance: 0.3
    FollowPath:
      plugin: "dwb_core::DWBLocalPlanner"
      debug_trajectory_details: True
      vx_samples: 30
      vy_samples: 1
      vtheta_samples: 30
      sim_time: 1.8
      linear_granularity: 0.05
      angular_granularity: 0.025
      min_vel_x: -0.15
      min_vel_y: 0.0
      max_vel_x: 0.22
      max_vel_y: 0.0
      max_vel_theta: 1.0
      min_speed_xy: 0.0
      max_speed_xy: 0.22
      min_speed_theta: 0.2
      acc_lim_x: 1.5        
      acc_lim_y: 0.0        
      acc_lim_theta: 1.0    
      decel_lim_x: -1.5     
      decel_lim_y: 0.0
      decel_lim_theta: -1.0 
      critics: ["RotateToGoal", "Oscillation", "BaseObstacle", "GoalAlign", "PathAlign", "PathDist", "GoalDist"]
      BaseObstacle.scale: 1.0
      PathAlign.scale: 32.0
      GoalAlign.scale: 12.0
      PathDist.scale: 32.0
      GoalDist.scale: 24.0
      RotateToGoal.scale: 32.0
      transform_tolerance: 2.0

local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 5.0  
      publish_frequency: 5.0
      global_frame: odom
      robot_base_frame: base_footprint
      use_sim_time: false
      rolling_window: true
      width: 3
      height: 3
      resolution: 0.05
      # Provisional conservative footprint. Replace with tape-measured extents.
      footprint: "[[0.18, 0.145], [0.18, -0.145], [-0.10, -0.145], [-0.10, 0.145]]"
      transform_tolerance: 2.0 
      plugins: ["voxel_layer", "range_sensor_layer", "inflation_layer"]
      
      voxel_layer:
        plugin: "nav2_costmap_2d::VoxelLayer"
        enabled: True
        observation_sources: scan bumper oakd_points
        scan:
          topic: /scan
          data_type: "LaserScan"
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          raytrace_max_range: 3.0
          raytrace_min_range: 0.0  
          obstacle_max_range: 2.5
          obstacle_min_range: 0.0
        bumper:                             # <--- BUMPER CONFIG ADDED HERE
          topic: /bumper_cloud
          data_type: "PointCloud2"
          max_obstacle_height: 2.0
          min_obstacle_height: 0.0
          # A contact point marks an obstacle but is not a free-space ray.
          clearing: False
          marking: True
          obstacle_max_range: 2.5
          obstacle_min_range: 0.0
        oakd_points:
          topic: /oakd/depth/points
          data_type: "PointCloud2"
          min_obstacle_height: 0.02
          max_obstacle_height: 1.50
          clearing: True
          marking: True
          raytrace_max_range: 3.0
          raytrace_min_range: 0.25
          obstacle_max_range: 2.5
          obstacle_min_range: 0.25
          
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 7.0
        inflation_radius: 0.26
        
      range_sensor_layer:
        plugin: "nav2_costmap_2d::RangeSensorLayer"
        enabled: true
        topics: ["/ir/left", "/ir/right", "/ultrasonic_distance"]
        no_readings_timeout: 2.0
        phi: 0.61              
        inflate_cone: 1.0      
        clear_on_max_reading: true
        clear_threshold: 0.2
        mark_threshold: 0.8

global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_footprint
      use_sim_time: false
      resolution: 0.05
      track_unknown_space: true
      footprint: "[[0.18, 0.145], [0.18, -0.145], [-0.10, -0.145], [-0.10, 0.145]]"
      transform_tolerance: 2.0 
      plugins: ["static_layer", "obstacle_layer", "range_sensor_layer", "inflation_layer"]
      
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True
        
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan bumper oakd_points
        scan:
          topic: /scan
          data_type: "LaserScan"
        bumper:                              # <--- BUMPER CONFIG ADDED HERE
          topic: /bumper_cloud
          data_type: "PointCloud2"
          clearing: False
          marking: True
          obstacle_max_range: 2.5
          obstacle_min_range: 0.0
        oakd_points:
          topic: /oakd/depth/points
          data_type: "PointCloud2"
          min_obstacle_height: 0.02
          max_obstacle_height: 1.50
          clearing: True
          marking: True
          raytrace_max_range: 3.0
          raytrace_min_range: 0.25
          obstacle_max_range: 2.5
          obstacle_min_range: 0.25
          
      range_sensor_layer:
        plugin: "nav2_costmap_2d::RangeSensorLayer"
        enabled: true
        topics: ["/ir/left", "/ir/right", "/ultrasonic_distance"]
        no_readings_timeout: 2.0
        phi: 0.61              
        inflate_cone: 1.0      
        clear_on_max_reading: true
        clear_threshold: 0.2
        mark_threshold: 0.8
        
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 7.0
        inflation_radius: 0.26

planner_server:
  ros__parameters:
    expected_planner_frequency: 5.0
    use_sim_time: false
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_navfn_planner::NavfnPlanner"
      tolerance: 0.5
      use_astar: false
      allow_unknown: true

behavior_server:
  ros__parameters:
    local_costmap_topic: local_costmap/costmap_raw
    global_costmap_topic: global_costmap/costmap_raw
    local_footprint_topic: local_costmap/published_footprint
    global_footprint_topic: global_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "drive_on_heading", "wait"]
    spin:
      plugin: "nav2_behaviors::Spin"
    backup:
      plugin: "nav2_behaviors::BackUp"
    drive_on_heading:
      plugin: "nav2_behaviors::DriveOnHeading"
    wait:
      plugin: "nav2_behaviors::Wait"
    local_frame: odom
    global_frame: map
    robot_base_frame: base_footprint
    transform_tolerance: 1.5
    use_sim_time: false
    enable_stamped_cmd_vel: false
    simulate_ahead_time: 2.0
    max_rotational_vel: 1.0
    min_rotational_vel: 0.4
    rotational_acc_lim: 3.2
