ekf_filter_node:
  ros__parameters:
    use_sim_time: false
    frequency: 15.0      # Lowered to 15Hz so the Raspberry Pi CPU doesn't choke
    two_d_mode: true
    publish_tf: true
    map_frame: map
    odom_frame: odom
    base_link_frame: base_footprint
    world_frame: odom

# Encoders: Trust for Forward Speed ONLY
    odom0: /odom
    odom0_config: [false, false, false,
                   false, false, false,
                   true,  true,  false,   # Trust wheels for X and Y speed
                   false, false, false,   # <--- CHANGED: DO NOT trust wheels for turning!
                   false, false, false]

    # IMU: Trust 100% for Turning Speed
    imu0: /imu/data
    imu0_config: [false, false, false,
                  false, false, false,    
                  false, false, false,
                  false, false, true,     # <--- IMU is the sole boss of rotation
                  false, false, false]